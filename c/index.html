<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lingo Word Challenge</title>
<meta name="description" content="A friend challenged you to find a word on Lingo Word.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Lingo Word — A friend challenged you!">
<meta property="og:description" content="Can you find the hidden word? Open it in Lingo Word.">
<meta name="apple-itunes-app" content="app-id=6747296509">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
:root {
  --ink: #0e0b24;
  --surface: #18143a;
  --line: #322c68;
  --text: #eeecfb;
  --muted: #a7a3cf;
  --accent: #8f7dff;
  --accent-2: #5cc8ff;
  --font-display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(circle at 50% 0%, #2a2260 0%, var(--ink) 60%);
  color: var(--text);
  font-family: var(--font-body);
  display: grid;
  place-items: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%;
  max-width: 420px;
  text-align: center;
  display: grid;
  gap: 22px;
}
.tiles { display: flex; justify-content: center; gap: 8px; }
.tile {
  width: 52px; height: 52px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--text);
  background: var(--surface);
  border: 2px solid var(--line);
  animation: pop .5s cubic-bezier(.3,1.6,.5,1) both;
}
.tile:nth-child(2) { animation-delay: .08s; }
.tile:nth-child(3) { animation-delay: .16s; }
.tile:nth-child(4) { animation-delay: .24s; }
.tile:nth-child(5) { animation-delay: .32s; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 6vw, 2rem);
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
}
p { margin: 0; color: var(--muted); line-height: 1.6; }
.steps {
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  display: grid;
  gap: 10px;
}
.step { display: flex; gap: 12px; align-items: flex-start; color: var(--text); }
.step b {
  flex: none;
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: #fff; font-size: .85rem;
}
.cta {
  display: block;
  padding: 16px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  font-weight: 800;
  font-size: 1.05rem;
  text-decoration: none;
  box-shadow: 0 10px 30px rgba(143, 125, 255, .35);
}
.cta:active { transform: scale(.98); }
@media (prefers-reduced-motion: reduce) { .tile { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="tiles" aria-hidden="true">
    <div class="tile">?</div><div class="tile">?</div><div class="tile">?</div><div class="tile">?</div><div class="tile">?</div>
  </div>
  <h1 id="title">A friend challenged you!</h1>
  <p id="lead">A secret word is waiting for you in Lingo Word. Can you find it?</p>
  <div class="steps">
    <div class="step"><b>1</b><span id="step1">Download Lingo Word from the App Store.</span></div>
    <div class="step"><b>2</b><span id="step2">Come back and tap your friend's link again. The word opens right in the game.</span></div>
  </div>
  <a class="cta" id="cta" href="https://apps.apple.com/app/id6747296509">Download on the App Store</a>
</main>
<script>
(function () {
  var tr = (navigator.language || "").toLowerCase().indexOf("tr") === 0;
  if (!tr) return;
  document.documentElement.lang = "tr";
  document.title = "Lingo Word Meydan Okuma";
  document.getElementById("title").textContent = "Arkadaşın sana meydan okudu!";
  document.getElementById("lead").textContent = "Lingo Word'de seni gizli bir kelime bekliyor. Bulabilir misin?";
  document.getElementById("step1").textContent = "Lingo Word'ü App Store'dan indir.";
  document.getElementById("step2").textContent = "Sonra buraya dön ve arkadaşının linkine tekrar dokun. Kelime doğrudan oyunda açılır.";
  document.getElementById("cta").textContent = "App Store'dan indir";
})();
</script>
</body>
</html>
